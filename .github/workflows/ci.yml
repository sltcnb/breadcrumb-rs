name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release

  fuzz:
    # The mutation fuzz runs with the normal tests; this job additionally
    # checks the cargo-fuzz targets still build, so a long campaign can be
    # started at any time without first fixing the harness.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # A prebuilt binary rather than `cargo install cargo-fuzz`, which spent
      # fifteen minutes compiling and made this the job that always got
      # cancelled by the next push.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Cache the fuzz build
        uses: actions/cache@v4
        with:
          path: fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: fuzz-${{ runner.os }}-
      - name: Build the fuzz targets
        run: cargo fuzz build
      - name: Short campaign on each target
        run: |
          for t in handlers ewf fve artifacts filesystems; do
            cargo fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=2048
          done

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.74.0
      - run: cargo build
